parameters:
- name: runPublicJobs
  type: boolean
  default: false
- name: runPrivateJobs
  type: boolean
  default: false
- name: runScheduledPrivateJobs
  type: boolean
  default: false
- name: onlySanityCheck
  type: boolean
  default: false

variables:
  # This entrypoint has one implicit stage. Keep asynchronous sends paired with its monitor.
  # Public runs always select correctness jobs; internal runs use the existing job selectors.
  # Use the inputs directly here: a variable defined in this block is not yet
  # available to conditions within the same block during template expansion.
  - ${{ if or(eq(variables['System.TeamProject'], 'public'), and(eq(variables['System.TeamProject'], 'internal'), or(notin(variables['Build.Reason'], 'PullRequest', 'Manual'), eq(variables['Build.CronSchedule.DisplayName'], 'Every 12 hours build'), parameters.runPublicJobs, parameters.runPrivateJobs, parameters.runScheduledPrivateJobs))) }}:
    - name: EnableHelixJobMonitor
      value: true
    # Matrix legs share a phase and queue. Keep their monitor identities distinct across channels.
    - name: TestRunNamePrefix
      value: '$(Agent.JobName)_'
    - template: /eng/common/templates/variables/pool-providers.yml
    - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest')) }}:
      # The standalone monitor does not inherit the submitter jobs' variable groups.
      - group: DotNet-HelixApi-Access
  - ${{ else }}:
    - name: EnableHelixJobMonitor
      value: false

resources:
  containers:
    - container: ubuntu_x64_build_container
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-22.04

trigger:
  branches:
    include:
    - main
  paths:
    exclude: # don't trigger if only docs and similar files changed
    - docs/*
    - '**/*.md'
    - 'gc-azure-pipelines.yml'
    - src/benchmarks/gc/*

pr:
  branches:
    include:
    - main
  paths:
    exclude: # don't trigger if only docs and similar files changed
    - docs/*
    - '**/*.md'
    - scripts/benchmarks_monthly.py
    - 'gc-azure-pipelines.yml'
    - src/benchmarks/gc/*

schedules:
- cron: "0 */12 * * *"
  displayName: Every 12 hours build
  branches:
    include:
    - main
  always: true
- cron: "0 21 * * THU"
  displayName: Weekly Build
  branches:
    include:
    - main
  always: true

jobs:
  - template: /eng/pipelines/sdk-perf-jobs.yml
    parameters:
      ${{ if or(eq(variables['System.TeamProject'], 'public'), parameters.runPublicJobs) }}:
        runPublicJobs: true
      ${{ if ne(variables['System.TeamProject'], 'public') }}:
        ${{ if or(notin(variables['Build.Reason'], 'PullRequest', 'Manual'), parameters.runPrivateJobs) }}:
          runPrivateJobs: true
        ${{ if or(eq(variables['Build.CronSchedule.DisplayName'], 'Every 12 hours build'), parameters.runScheduledPrivateJobs) }}:
          runScheduledPrivateJobs: true
      jobParameters:
        ${{ if parameters.onlySanityCheck }}:
          onlySanityCheck: true

  - ${{ if eq(variables.EnableHelixJobMonitor, 'true') }}:
    - template: /eng/common/core-templates/job/helix-job-monitor.yml
      parameters:
        timeoutInMinutes: 360
        ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest')) }}:
          helixAccessToken: $(HelixApiAccessToken)
        allowNoHelixJobs: false
